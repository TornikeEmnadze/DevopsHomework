server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: observability-app-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: observability-app
          service: observability-app
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            method: method
            path: path
            status: status
            trace_id: trace_id
      - labels:
          level:
          method:
          path:
          status:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message
